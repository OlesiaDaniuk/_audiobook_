<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="turn.js"></script>
<script>
	$(document).ready(function(){
		$("#book").turn({
			width: "100%",
			height: "95%",
			autoCenter: true
		});
		$("#book").bind("turning", function(event, page, view){
			const audioPlayer = document.getElementById("audioPlayer");
			audioPlayer.style.display = "block";
			const audioSource = document.getElementById("audioSource");
			switch(page){
			case 2:
			case 3:
				audioSource.src = "1.mp3";
				break;
			case 4:
			case 5:
				audioSource.src = "2.mp3";
				break;
			case 6:

				break;

			case 12:

				break;
			case 30:

				audioSource.src = "15.mp3";
				break;
			case 32:
			case 33:
				audioSource.src = "16.mp3";
				break;
			case 34:
			case 35:
				audioSource.src = "17.mp3";
				break;
			case 36:
			case 37:
				audioSource.src = "18.mp3";
				break;
			case 38:
			case 39:
				audioSource.src = "19.mp3";
				break;
			case 40:

				audioSource.src = "20.mp3";
				break;
			case 42:
			case 43:
				audioSource.src = "21.mp3";
				break;
			case 44:

				audioSource.src = "22.mp3";
				break;
			case 46:
			case 47:
				audioSource.src = "23.mp3";
				break;
			case 48:
			case 49:
				audioSource.src = "24.mp3";
				break;
			default:
				audioSource.src = "";
				audioPlayer.style.display = "none";
				break;
			}
			if (audioSource.src){
				audioPlayer.load();
				audioPlayer.play();
			}else {
				audioPlayer.pause();
			}
		});
	});
</script>
